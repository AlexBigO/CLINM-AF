visu:
  activate: False
  type: qt

multithreading:
  nthreads: 4  # MT activated if not null

physics_list: QGSP_INCLXX_HP

source:
  particle: carbon  # possibilities: proton, helium, lithium, bore, carbon
  energy_spectrum:  # type "gauss"
    mean: 120 # in MeV/u
    sigma: 0 # in MeV
  n: 1000000000

target:
  exists: True # False if no target (e.g. calibration run)
  material: G4_Al
  size: [10, 10, 0.5] # in cm

distances:  # these are edge-to-edge distances!
  source_target: 75  # in cm
  target_plastic1: 126.5  # in cm
  source_plastic1: null # in cm; null if there is a target
  plastic1_plastic2: 4  # in cm
  plastic2_cebr: 3 # in cm

telescope:
  angle: 6.4  # in degrees; possibilities: any float, null for angle of 0°

campaign: CNAO_0925
run: "08"

output:
  dir: /work/desis/CLINM/Simulation/SimResultsRaw/CNAO_0925
